# Example tiers file for lkml-pr-tier.py.
#
# Copy to ~/.config/lkml/tiers.yaml (or point LKML_TIERS_FILE at a copy)
# and edit. There is no fallback location: a missing file fails and names
# the path it wanted. Every key below is validated; an unknown key, a
# duplicate key or a seat that cannot sit on a panel refuses the file
# rather than silently applying to nothing.
#
# A TIER sizes the review panel for one pull request. The three tiers are
# fixed -- quick < standard < full -- and all three must be defined.
# (This is unrelated to the postmaster's per-wake classifier in the fleet
# file.)
#
# Glob syntax, used by every path list in this file: a glob matches the
# WHOLE repo-relative path. `**` spans directories (`src/**` is the whole
# tree under src; `**/x.md` is x.md at any depth, including the top),
# `*` and `?` stay inside one path component (`*.md` matches README.md
# but not docs/README.md), and `[abc]` is a character class. The globs
# below are invented examples.

# The tier used when no matching rule names one. `standard` makes doubt
# resolve upward from a quick review.
default-tier: standard

tiers:
  quick:
    roster: [core, tests]
    needs-env: false          # does this tier need a preview environment?
    budget: 16                # spawn budget. PLACEHOLDER: replace with
                              # numbers from a shadow run.
    extra-seats: 0            # how many seats `add-seat` rules may append
  standard:
    roster: [core, tests, architecture]
    needs-env: false
    budget: 40                # placeholder
    extra-seats: 1            # at most one seat picked by path rules
  full:
    roster: [architecture, core, docs, newcomer, security, tests]
    needs-env: true
    budget: 96                # placeholder
    extra-seats: 0

# Labels are compared case-insensitively. The values shown are the
# defaults; this block may be omitted. A draft PR, a bot author or a skip
# label skips the review, checked before any rule. A force-full label
# gives `full` regardless of rules; `lkml` is the legacy spelling.
labels:
  skip: [lkml-skip]
  full: [lkml-full, lkml]

# Path sets behind the `docs-only`, `tests-only` and `new-dependency`
# rule conditions. Each may be empty, in which case the condition never
# fires.
docs-paths: ["docs/**", "**/*.md"]
tests-paths: ["tests/**", "**/*_test.*", "**/test_*"]
dependency-manifests:
  - package.json
  - requirements*.txt
  - go.mod
  - "**/Cargo.toml"

# Rules run over the diff (merge base to head). A rule needs `name`
# (unique), one or more conditions that AND together, and one or more
# effects.
#
#   conditions: paths: [globs]   any touched path matches any glob
#               min-lines: N     lines added + deleted >= N
#               max-lines: N     lines added + deleted <= N
#               docs-only: true  every touched path is in docs-paths
#               tests-only: true every touched path is in tests-paths
#               new-dependency: true  a dependency manifest is touched
#   effects:    tier: <tier>     the HIGHEST tier any matching rule names
#                                wins; with none, default-tier applies
#               add-seat: <seat> append this seat, up to the tier's
#                                extra-seats, in file order
#               ambiguous: true  mark the result ambiguous, so the
#                                optional LLM tie-break may raise it
#
# Author and secretary are never panel members and are refused here.
rules:
  - name: docs-only
    docs-only: true
    tier: quick
  - name: tests-only
    tests-only: true
    tier: quick
  - name: migrations
    paths: ["**/migrations/**"]
    tier: full
  - name: big-change
    min-lines: 400
    tier: full
  - name: new-dependency
    new-dependency: true
    tier: full
    ambiguous: true
  - name: auth-paths
    paths: ["src/auth/**"]
    add-seat: security
  - name: docs-touched
    paths: ["docs/**"]
    add-seat: docs
